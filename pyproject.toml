[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "cmake>=3.15", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "pylibCZIrw"
version = "0.0.0"
description = "A python wrapper around the libCZI C++ library with reading and writing functionality."
readme = { file = "INFO.md", content-type = "text/markdown" }
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.LESSER", "NOTICE.txt"]
authors = [{ name = "Sebastian Soyer", email = "sebastian.soyer@zeiss.com" }]
keywords = ["czi", "imaging"]
requires-python = ">=3.9,<3.15"
dependencies = ["numpy", "xmltodict", "validators", "packaging"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/ZEISS/pylibczirw"

[project.optional-dependencies]
test = [
    "mypy",
    "check-python-versions",
    "tox>=4",
    "tox-current-env",
    "pytest",
    "defusedxml",
]
deploy = ["build", "pip"]

[tool.scikit-build]
ninja.version = ">=1.11"
cmake.version = ">=3.15"
cmake.build-type = "Release"
build.targets = ["_pylibCZIrw"]
build-dir = "build/{wheel_tag}"
wheel.packages = ["pylibCZIrw"]
sdist.include = [
    "_pylibCZIrw/",
    "libs/",
    "CMakeLists.txt",
    "CMakeSettings.json",
    "INFO.md",
    "CHANGELOG.md",
]
sdist.exclude = [
    "libs/libCZIrw/Src/CZICheck/",
    "libs/libCZIrw/Src/CZICmd/",
    "libs/libCZIrw/Src/Test/",
    "libs/libCZIrw/Src/libCZI_UnitTests/",
]

# Common CMake defines passed to all builds.
# Platform-specific defines (e.g. vcpkg toolchain, static OpenSSL) should be
# passed via the CMAKE_ARGS environment variable in CI.
[tool.scikit-build.cmake.define]
PYLIBCZIRW_VERSION = "0.0.0"
LIBCZI_BUILD_DYNLIB = "OFF"
LIBCZI_BUILD_UNITTESTS = "OFF"
LIBCZI_BUILD_CURL_BASED_STREAM = "ON"
LIBCZI_BUILD_PREFER_EXTERNALPACKAGE_LIBCURL = "ON"
LIBCZI_BUILD_PREFER_EXTERNALPACKAGE_EIGEN3 = "ON"

# Windows: use static MSVC runtime and vcpkg static triplet
[[tool.scikit-build.overrides]]
if.platform-system = "win32"
cmake.define.VCPKG_TARGET_TRIPLET = "x64-windows-static"

[tool.pytest.ini_options]
testpaths = ["pylibCZIrw/tests"]
